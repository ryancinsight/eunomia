name: Minimum Supported Rust Version

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/msrv.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "examples/**"
      - "benches/**"
  pull_request:
    paths:
      - ".github/workflows/msrv.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/**"
      - "examples/**"
      - "benches/**"

permissions:
  contents: read

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: msrv-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Rust 1.95.0 all-target check
    runs-on: ubuntu-latest
    env:
      # The install step sets a rustup *default*; the committed rust-toolchain.toml
      # outranks it, so without this the job compiled with the pinned channel.
      RUSTUP_TOOLCHAIN: 1.95.0
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Prove the toolchain under test
        run: rustc --version && cargo --version

      - name: Check all targets at the MSRV
        run: cargo check --locked --workspace --all-targets --all-features
