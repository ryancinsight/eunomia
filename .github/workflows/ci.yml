name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      # Shared-key rust-cache so the feature-matrix build is warm across PRs
      # instead of rebuilding from scratch each time. One entry is written from
      # main only (concurrent branches cannot evict it); invalidation is
      # incremental, so a dependency repin rebuilds only the affected crates,
      # not the whole workspace. Mirrors the CFDrs #375/ritk #211/helios
      # #75/themis #32 lever under ATLAS-CI-RUNNER-SATURATION.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: .
          shared-key: eunomia
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      # eunomia is `no_std` unless `std` is on, and the test targets are as
      # much a part of that contract as the lib. Both configurations below
      # were broken and nothing caught it, because this crate had no CI: the
      # test modules reached for `Vec`/`vec!` through std. Checking
      # `--all-targets` per feature is what makes that a build failure rather
      # than a latent one.
      - name: Check the feature matrix
        run: |
          set -euo pipefail
          for features in \
            "--no-default-features" \
            "--no-default-features --features rkyv" \
            "--no-default-features --features serde" \
            "--features rkyv" \
            "--features serde" \
            "--features rkyv,serde"
          do
            echo "::group::cargo check $features"
            cargo check --locked --workspace --all-targets $features
            echo "::endgroup::"
          done

      - name: Lint all affected targets
        run: cargo clippy --locked --workspace --all-targets --features rkyv,serde -- -D warnings

      - name: Run native tests
        run: cargo nextest run --locked --workspace --features rkyv,serde

      - name: Run documentation tests
        run: cargo test --locked --workspace --features rkyv,serde --doc

      # Broken intra-doc links do not fail an ordinary build, so without this
      # gate they accumulate: seventeen were already present when it was added.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --features rkyv,serde

  numpy:
    name: NumPy feature contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned NumPy runtime
        run: python -m pip install --disable-pip-version-check "numpy==2.5.1"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: .
          shared-key: eunomia
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check the NumPy feature
        run: cargo check --locked --workspace --all-targets --features numpy

      - name: Lint the NumPy feature
        run: cargo clippy --locked --workspace --all-targets --features numpy -- -D warnings

      - name: Run the NumPy contract tests
        run: cargo nextest run --locked --workspace --features numpy

      - name: Run NumPy documentation tests
        run: cargo test --locked --workspace --features numpy --doc

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny is installed and pinned here rather than run through
      # cargo-deny-action, which bundles its own copy: the version in
      # v2.0.14 cannot parse the CVSS 4.0 vector in RUSTSEC-2026-0109 and
      # aborts while loading the advisory database, so the job fails on a
      # database entry unrelated to this crate. Pinning the tool directly
      # keeps the version under our control, the same way nextest is handled
      # in the verify job.
      - name: Install cargo-deny
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-deny@0.20.2

      - name: Audit advisories, licences, bans and sources
        run: cargo deny --all-features check
