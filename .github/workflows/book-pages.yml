name: Deploy mdBook



on:

  push:

    branches: [main]

    paths:

      - "docs/book/**"

      - ".github/workflows/book-pages.yml"
      - "scripts/check_book_figures.py"
      - "scripts/generate_book_figures.py"
      - "scripts/tests/test_check_book_figures.py"

  pull_request:

    paths:

      - "docs/book/**"

      - ".github/workflows/book-pages.yml"
      - "scripts/check_book_figures.py"
      - "scripts/generate_book_figures.py"
      - "scripts/tests/test_check_book_figures.py"

  workflow_dispatch:



permissions:

  contents: read



concurrency:

  group: book-pages-${{ github.ref }}

  cancel-in-progress: true



jobs:
  check-figures:
    name: Check book figures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify local figure references
        run: |
          python3 scripts/generate_book_figures.py docs/book --check
          python3 scripts/check_book_figures.py docs/book

  deploy:
    needs: check-figures

    # Body owned once by Atlas (ADR 0035); the caller passes only the

    # built output directory. Enable Pages once per repository under

    # Settings -> Pages -> Source: GitHub Actions.

    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239

    permissions:

      contents: read

      pages: write

      id-token: write # OIDC Pages artifact flow; no deploy key.

    with:

      output-path: target/book/eunomia

      mdbook-test: true

      # Must match rust-toolchain.toml: cargo build honours the pin while

      # mdbook spawns rustdoc from the installed default, and a mismatch

      # fails E0514 (crate compiled by an incompatible rustc).

      rust-toolchain: "1.97.0"

      cargo-package: eunomia
