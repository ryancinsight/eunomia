[package]
name = "eunomia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Atlas datatype law: the Single Source of Truth for numeric/scalar datatype vocabulary (scalars, complex, packed formats, conversions)"

[dependencies]
bytemuck = { workspace = true }
libm = { version = "0.2.8", default-features = false }
rkyv = { workspace = true, optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
numpy = { version = "0.29", optional = true }
pyo3 = { version = "0.29", optional = true }

[features]
default = ["std"]
std = []
# `bytecheck` is not optional decoration: RUSTSEC-2026-0235 was an archive
# validation flaw, and validated access is the only way to read an archive from
# an untrusted source without it being an unsafe operation.
rkyv = ["dep:rkyv", "rkyv/pointer_width_32", "rkyv/alloc", "rkyv/bytecheck"]
serde = ["dep:serde"]
# NumPy interop: `unsafe impl numpy::Element for Complex<f32|f64>` so the SSOT
# complex type is usable directly as a rust-numpy array element (Python bindings).
numpy = ["dep:numpy", "dep:pyo3", "std"]

[dev-dependencies]
criterion = "0.5"
half = { workspace = true }

# Reduced-precision conversion throughput: F16C-accelerated bulk paths vs the
# scalar kernel, and the SIMD packed-unpack dispatch. Baselines gate regressions.
[[bench]]
name = "conversions"
harness = false
