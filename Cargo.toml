[workspace]
resolver = "2"
members = ["crates/eunomia"]

[workspace.package]
version = "0.8.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ryancinsight/eunomia"

# Stack lint floor. Declared once here; every member inherits it with
# `lints.workspace = true`. New and touched code meets the full floor; the
# `allow` entries below are a curated, non-increasing baseline for classes that
# fire broadly across the existing tree, each recorded with its measured hit
# count at the revision the floor was established. Removing an entry (or
# shrinking its count) is burn-down work; adding one requires the same
# justification any suppression does. Anything not listed is a hard error.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Eunomia is the datatype law: an input-dependent `unwrap` in it panics inside
# every consumer's process. Zero sites in the tree -- denied outright, no ratchet.
unwrap_used = "deny"

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed is a
# hard error. Counts are `cargo clippy --all-targets --features rkyv,serde` hits
# (the gate's own invocation) at the time the floor was established, deduplicated
# per source site, as total (production), where production excludes
# `#[cfg(test)]` modules and test, bench and example targets. Burn a class down
# to zero, then delete its line -- the floor tightens, never loosens.

# --- Numeric conversion debt (242 sites, 230 in production) ---
# Eunomia's whole purpose is representation conversion, so the cast family is
# the domain, not an accident: each site is a specified narrowing/widening
# quantizer whose range is proven by the surrounding format invariants.
cast_possible_truncation = "allow" # 86 (76 prod)
cast_possible_wrap = "allow"       # 45 (45 prod)
ptr_as_ptr = "allow"               # 44 (44 prod)
cast_ptr_alignment = "allow"       # 35 (35 prod)
cast_lossless = "allow"            # 38 (36 prod)
cast_sign_loss = "allow"           # 21 (21 prod)
cast_precision_loss = "allow"      # 16 (12 prod)

# --- Public-surface annotation debt (234 sites, 234 in production) ---
# Scalar trait methods are single-instruction forwards to the primitive op;
# inlining them is the zero-cost-abstraction contract, not a hint.
inline_always = "allow"            # 116 (116 prod)
# `#[must_use]` on every combinator and accessor of a scalar vocabulary crate
# is noise at this density; revisit as a targeted pass over the public surface.
return_self_not_must_use = "allow" # 62 (62 prod)
must_use_candidate = "allow"       # 56 (56 prod)

# --- Naming and layout debt (32 sites, 21 in production) ---
# The SIMD unpack kernels declare their intrinsic helper `fn`s next to the use
# site inside `#[target_feature]` bodies, which is where they belong.
items_after_statements = "allow"   # 18 (16 prod)
wildcard_imports = "allow"         # 4  (4 prod)  `use core::arch::x86_64::*`
# Index-suffixed and mathematical names (`lo`/`hi`, `re`/`im`, `a`/`b`/`c`/`d`
# in complex arithmetic) are the clearest spelling of the formulas involved.
similar_names = "allow"            # 6  (1 prod)
many_single_char_names = "allow"   # 1  (0 prod)
# Exact float comparison is the assertion in a crate whose contract is bit-level
# encoding behaviour; tolerances would weaken the test.
float_cmp = "allow"                # 6  (1 prod)
too_many_lines = "allow"           # 1  (0 prod) table-driven conformance test

[workspace.dependencies]
eunomia = { path = "crates/eunomia" }
bytemuck = { version = "1.14", features = ["derive"] }
libm = { version = "0.2.8", default-features = false }
rkyv = { version = "0.8", default-features = false }
